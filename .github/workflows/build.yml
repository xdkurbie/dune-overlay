name: build
on: { push: { branches: [main], tags: ['v*'] }, pull_request: {}, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  test:
    runs-on: ubuntu-latest
    steps: [ {uses: actions/checkout@v4}, {uses: actions/setup-node@v4, with: {node-version: 20}}, {run: npm ci}, {run: npm test} ]
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: DuneOverlay-exe, path: dist/*.exe }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: dist/*.exe }
